<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El sitio es de acceso abierto para quien tenga el enlace, pero pedimos a los
         buscadores que no lo indexen ni lo muestren en resultados. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Estrategia 2031 — Árbol estratégico</title>
    <meta
      name="description"
      content="Árbol estratégico interactivo: objetivo al 2031, oportunidades, valor agregado y agendas institucionales."
    />
    <!-- El ?v= obliga al navegador a bajar los archivos de nuevo cuando cambian.
         Si editás css/estilos.css, js/contenido.js o js/app.js, subí el número
         en las tres líneas (acá y al final del body). Sin esto, quien ya visitó
         la página sigue viendo la versión vieja hasta que se le venza la caché. -->
    <link rel="stylesheet" href="css/estilos.css?v=8" />
  </head>

  <body>
    <a class="salto-contenido" href="#arbol">Saltar al contenido</a>

    <header class="encabezado">
      <div class="encabezado__texto">
        <h1 class="encabezado__titulo" id="app-titulo">Estrategia 2031</h1>
        <p class="encabezado__subtitulo" id="app-subtitulo">Árbol estratégico institucional</p>
      </div>
      <div class="buscador">
        <div class="buscador__campo">
          <svg class="buscador__lupa" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" />
            <path d="M16.5 16.5L21 21" />
          </svg>
          <input
            class="buscador__entrada"
            id="buscador"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Buscar un tema en el árbol estratégico"
            aria-describedby="buscador-estado"
          />
          <button class="buscador__limpiar" id="buscador-limpiar" type="button" aria-label="Limpiar búsqueda" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p class="buscador__estado" id="buscador-estado" role="status" aria-live="polite">
          <span class="encabezado__punto" aria-hidden="true"></span>
          <span id="app-ayuda">Hacé clic en cualquier tarjeta para ver el detalle</span>
        </p>
      </div>
    </header>

    <!-- El árbol se dibuja acá desde js/app.js con los datos de js/contenido.js -->
    <main class="arbol" id="arbol"></main>

    <footer class="pie">
      <p id="app-pie"></p>
    </footer>

    <!-- Panel de detalle -->
    <div class="fondo-panel" id="fondo-panel" hidden></div>

    <aside
      class="panel"
      id="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="panel-titulo"
      hidden
    >
      <div class="panel__barra">
        <div class="panel__meta">
          <span class="panel__etiqueta" id="panel-etiqueta"></span>
          <span class="panel__sello" id="panel-sello" hidden>Borrador</span>
        </div>
        <button class="panel__cerrar" id="panel-cerrar" type="button" aria-label="Cerrar detalle">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <!-- El contenido lo arma js/app.js según el elemento que se abrió -->
      <div class="panel__cuerpo" id="panel-cuerpo"></div>

      <nav class="panel__navegacion" aria-label="Navegar entre tarjetas">
        <button class="nav-boton" id="nav-anterior" type="button">
          <span aria-hidden="true">‹</span> Anterior
        </button>
        <span class="nav-posicion" id="nav-posicion"></span>
        <button class="nav-boton" id="nav-siguiente" type="button">
          Siguiente <span aria-hidden="true">›</span>
        </button>
      </nav>
    </aside>

    <script src="js/contenido.js?v=8"></script>
    <script src="js/app.js?v=8"></script>
  </body>
</html>
